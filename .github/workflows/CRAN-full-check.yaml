name: Full CRAN readiness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Ubuntu (R ${{ matrix.r }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        r: [devel, release]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::V8
          needs: check

      - uses: r-lib/actions/setup-tinytex@v2

      - name: Ensure PDF manual tools
        run: |
          tlmgr install courier makeindex
          pdflatex --version
          kpsewhich pcrr8t.tfm
          command -v makeindex

      - name: Preflight indexed PDF manual
        run: |
          manual_diag="$RUNNER_TEMP/prime-manual-diagnostics"
          mkdir -p "$manual_diag"
          command -v makeindex > "$manual_diag/makeindex-path.txt" || true
          set +e
          R CMD Rd2pdf --no-preview --internals --no-clean \
            --build-dir="$manual_diag/indexed" \
            --output="$manual_diag/indexed.pdf" . \
            > "$manual_diag/indexed.stdout.log" 2>&1
          indexed_status=$?
          cat "$manual_diag/indexed.stdout.log"
          printf 'indexed_exit=%s\n' "$indexed_status" \
            > "$manual_diag/exit-status.txt"
          exit "$indexed_status"

      - name: Preserve indexed PDF manual diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-manual-${{ matrix.r }}
          path: ${{ runner.temp }}/prime-manual-diagnostics
          if-no-files-found: ignore

      - name: Build HTML Tidy 5.8.0
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git
          tidy_src="$RUNNER_TEMP/tidy-html5"
          tidy_build="$RUNNER_TEMP/tidy-build"
          git clone --depth 1 --branch 5.8.0 \
            https://github.com/htacg/tidy-html5.git "$tidy_src"
          cmake -S "$tidy_src" -B "$tidy_build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIB=OFF \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build "$tidy_build" --target tidy --parallel 2
          "$tidy_build/tidy" --version
          "$tidy_build/tidy" --version | grep -Eq '5[.]8[.]0$'
          printf 'R_TIDYCMD=%s\n' "$tidy_build/tidy" >> "$GITHUB_ENV"

      - uses: r-lib/actions/check-r-package@v2
        env:
          NOT_CRAN: 'false'
          _R_CHECK_CRAN_INCOMING_: 'true'
          _R_CHECK_CRAN_INCOMING_REMOTE_: 'true'
          _R_CHECK_FORCE_SUGGESTS_: 'true'
          _R_CHECK_SYSTEM_CLOCK_: 'true'
          _R_CHECK_RD_VALIDATE_RD2HTML_REFMAN_ONLY_: 'false'
        with:
          args: 'c("--as-cran", "--run-donttest")'
          build_args: 'character()'
          error-on: '"warning"'
          upload-results: 'true'
          artifact-name: cran-full-${{ matrix.r }}
